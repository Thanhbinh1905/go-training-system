version: '3'

dotenv: ['.env']

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  initdb:
    desc: Run PostgreSQL container with env vars
    cmds:
      - docker run --name postgres \
          -e POSTGRES_PASSWORD={{.POSTGRES_PASSWORD}} \
          -e POSTGRES_USER={{.POSTGRES_USER}} \
          -p {{.POSTGRES_PORT}}:5432 \
          -d postgres:13.21-alpine3.21

  createdb:
    desc: Create a new PostgreSQL database inside the running container
    cmds:
      - docker exec -it postgres createdb --username={{.POSTGRES_USER}} --owner={{.POSTGRES_USER}} {{.POSTGRES_DB}}

  dropdb:
    desc: Drop the PostgreSQL database if it exists
    cmds:
      - docker exec -it postgres dropdb --username={{.POSTGRES_USER}} --if-exists {{.POSTGRES_DB}}

  resetdb:
    desc: Reset the PostgreSQL database by dropping and recreating it
    cmds:
      - task dropdb
      - task createdb

  server:user:
    cmds:
      - go run services/user-service/server.go

  user:gqlgen:
    cmds:
      - gqlgen services/user-service/ generate

  pqsl:user:
    cmds:
      - docker exec -it user-db psql -U root -d user
  
  pqsl:team:
    cmds:
      - docker exec -it team-db psql -U root -d team
  
  pqsl:asset:
    cmds:
      - docker exec -it asset-db psql -U root -d asset

  proto:user:
    cmds:
      - |
        protoc \
          --proto_path=shared/proto \
          --go_out=services/user-service/pb \
          --go_opt=paths=source_relative \
          --go-grpc_out=services/user-service/pb \
          --go-grpc_opt=paths=source_relative \
          shared/proto/user/user.proto
  proto:team:
    cmds:
      - |
        protoc \
          --proto_path=shared/proto \
          --go_out=services/team-service/pb \
          --go_opt=paths=source_relative \
          --go-grpc_out=services/team-service/pb \
          --go-grpc_opt=paths=source_relative \
          shared/proto/user/user.proto
      - |
        protoc \
          --proto_path=shared/proto \
          --go_out=services/team-service/pb \
          --go_opt=paths=source_relative \
          --go-grpc_out=services/team-service/pb \
          --go-grpc_opt=paths=source_relative \
          shared/proto/team/team.proto

  proto:asset:
    cmds:
      - |
        protoc \
          --proto_path=shared/proto \
          --go_out=services/asset-service/pb \
          --go_opt=paths=source_relative \
          --go-grpc_out=services/asset-service/pb \
          --go-grpc_opt=paths=source_relative \
          shared/proto/user/user.proto
      - |
        protoc \
          --proto_path=shared/proto \
          --go_out=services/asset-service/pb \
          --go_opt=paths=source_relative \
          --go-grpc_out=services/asset-service/pb \
          --go-grpc_opt=paths=source_relative \
          shared/proto/team/team.proto

  redis-cli: 
    cmds:
      - docker exec -it redis redis-cli

  kafka-topics:
    desc: List Kafka topics
    cmds:
      - docker exec -it kafka kafka-topics --bootstrap-server kafka:29092 --list

  kafka-console-consumer:
    desc: Consume messages from a Kafka topic
    cmds:
      - |
        echo "Usage: task kafka-console-consumer -- topic_name"
      - docker exec -it kafka kafka-console-consumer --bootstrap-server kafka:29092 --topic {{.CLI_ARGS | default "team.activity"}} --from-beginning

  kafka-console-producer:
    desc: Produce messages to a Kafka topic
    cmds:
      - |
        echo "Usage: task kafka-console-producer -- topic_name"
      - docker exec -it kafka kafka-console-producer --bootstrap-server kafka:29092 --topic {{.CLI_ARGS | default "team.activity"}}

  kafka-logs:
    desc: View Kafka logs
    cmds:
      - docker logs kafka

  kafka-topic-init: 
    cmds:
      - docker exec -it kafka kafka-topics --bootstrap-server kafka:29092 --create --topic team.activity --partitions 1 --replication-factor 1
      - docker exec -it kafka kafka-topics --bootstrap-server kafka:29092 --create --topic asset.changes --partitions 1 --replication-factor 1
      
  kafka-reset:
    desc: Reset Kafka topics (delete and recreate)
    cmds:
      - docker exec -it kafka kafka-topics --bootstrap-server kafka:29092 --delete --topic team.activity
      - docker exec -it kafka kafka-topics --bootstrap-server kafka:29092 --delete --topic asset.changes
      - docker exec -it kafka kafka-topics --bootstrap-server kafka:29092 --create --topic team.activity --partitions 1 --replication-factor 1
      - docker exec -it kafka kafka-topics --bootstrap-server kafka:29092 --create --topic asset.changes --partitions 1 --replication-factor 1

  graceful-shutdown-test:
    desc: Test graceful shutdown by sending SIGTERM to services
    cmds:
      - echo "Testing graceful shutdown..."
      - |
        echo "Send SIGTERM to user-service: docker kill --signal=SIGTERM user-service"
      - |
        echo "Send SIGTERM to team-service: docker kill --signal=SIGTERM team-service"
      - |
        echo "Send SIGTERM to asset-service: docker kill --signal=SIGTERM asset-service"
      - |
        echo "Check logs: docker logs user-service | tail -20"

  service-logs:
    desc: View service logs
    cmds:
      - echo "User Service Logs:"
      - docker logs user-service --tail=20
      - echo ""
      - echo "Team Service Logs:"
      - docker logs team-service --tail=20
      - echo ""
      - echo "Asset Service Logs:"
      - docker logs asset-service --tail=20