server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: team-service-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: team-service
          __path__: /var/log/team-service/*.log
  - job_name: user-service-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: user-service
          __path__: /var/log/user-service/*.log
  - job_name: asset-service-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: asset-service
          __path__: /var/log/asset-service/*.log
