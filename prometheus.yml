global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'team-service'
    static_configs:
      - targets: ['team-service:8080']
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8080']
  - job_name: 'asset-service'
    static_configs:
      - targets: ['asset-service:8080']
